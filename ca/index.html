<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="IKIGAIER — L'ikigai que no et van explicar. Un ecosistema per unir el fer i el ser.">
  <meta name="robots" content="noindex, follow">
  <title>IKIGAIER · Català</title>
  <link rel="canonical" href="https://www.ikigaier.com/ca/">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/assets/site.webmanifest">

  <!-- Open Graph -->
  <meta property="og:title" content="IKIGAIER · Català">
  <meta property="og:description" content="L'ikigai que no et van explicar. Un ecosistema per unir el fer i el ser.">
  <meta property="og:url" content="https://www.ikigaier.com/ca/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ca_ES">

  <!-- Hreflang -->
  <link rel="alternate" hreflang="es" href="https://www.ikigaier.com/es/">
  <link rel="alternate" hreflang="ca" href="https://www.ikigaier.com/ca/">
  <link rel="alternate" hreflang="en" href="https://www.ikigaier.com/en/">
  <link rel="alternate" hreflang="x-default" href="https://www.ikigaier.com/es/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/main.css">

  <style>
    .placeholder-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      gap: 2rem;
    }
    .placeholder-logo {
      width: clamp(140px, 20vw, 200px);
      height: auto;
    }
    .placeholder-title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--negro);
      margin: 0;
    }
    .placeholder-frase {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--gris-medio);
      max-width: 420px;
      line-height: 1.7;
      margin: 0;
    }
    .placeholder-status {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gris-claro);
      margin: 0;
    }
    .placeholder-divider {
      border: none;
      border-top: 1px solid var(--gris-claro);
      opacity: 0.25;
      width: 50px;
      margin: 0 auto;
    }
    .placeholder-link {
      color: var(--terracota);
      text-decoration: none;
      font-weight: 400;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .placeholder-link:hover { opacity: 0.7; }
  </style>
</head>
<body>
  <main class="placeholder-page">
    <img class="placeholder-logo" src="/assets/logo-ikigaier-bicolor.png" alt="IKIGAIER" width="2500" height="781">
    <span class="placeholder-title">IKIGAIER</span>
    <p class="placeholder-frase">Camina sense separar-te de tu.</p>
    <hr class="placeholder-divider">
    <p class="placeholder-status">Versió en català en preparació</p>
    <a class="placeholder-link" href="/es/">Veure la versió en castellà →</a>
  </main>
</body>
</html>
