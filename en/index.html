  <style>
    .placeholder-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      gap: 2rem;
    }
    .placeholder-logo {
      width: clamp(140px, 20vw, 200px);
      height: auto;
    }
    .placeholder-title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--negro);
      margin: 0;
    }
    .placeholder-frase {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--gris-medio);
      max-width: 420px;
      line-height: 1.7;
      margin: 0;
    }
    .placeholder-status {
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gris-claro);
      margin: 0;
    }
    .placeholder-divider {
      border: none;
      border-top: 1px solid var(--gris-claro);
      opacity: 0.25;
      width: 50px;
      margin: 0 auto;
    }
    .placeholder-link {
      color: var(--terracota);
      text-decoration: none;
      font-weight: 400;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .placeholder-link:hover { opacity: 0.7; }

  <main class="placeholder-page">
